services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: autoapply
      POSTGRES_USER: autoapply
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes: ["database:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autoapply"]
      interval: 5s
      retries: 20
  api:
    build: ./backend
    environment: &backend
      DATABASE_URL: postgresql+psycopg://autoapply:${POSTGRES_PASSWORD}@db/autoapply
      API_TOKEN: ${API_TOKEN:?Set API_TOKEN in .env}
      OLLAMA_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b}
      DATA_DIR: /data
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes: ["documents:/data"]
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      retries: 10
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    command: ["python", "-m", "autoapply.worker"]
    environment: *backend
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes: ["documents:/data"]
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped
  web:
    build: ./frontend
    ports: ["127.0.0.1:8080:80"]
    depends_on:
      api: {condition: service_healthy}
volumes:
  database:
  documents:
